name: Bug in the app
description: Something in the app or the build does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead (error text or a screenshot).
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Page or command (e.g. /map, python -m bidb.build), local app or the static copy, browser and OS.
