# Publishes the static copy (dist/ from `python -m app.static_export --full-pages`) on GitHub Pages.
# The site (~270 MB) is not in git: it is a release asset `site.tar.gz` on a `site-YYYY-MM-DD` release, made with
#   .venv/bin/python -m app.static_export --full-pages && tar -czf site.tar.gz -C dist .
#   gh release create site-YYYY-MM-DD site.tar.gz --title "Static site YYYY-MM-DD" --notes "..."
# This workflow deploys the newest such release (or the tag given) whenever a site release is published or by hand.
name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Site release tag (default the newest site-*)
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'site-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the site release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("site-"))][0]')
          fi
          echo "Deploying $TAG"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p site.tar.gz
          mkdir site && tar -xzf site.tar.gz -C site
          touch site/.nojekyll
          test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
