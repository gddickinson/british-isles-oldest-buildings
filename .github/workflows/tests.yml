name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # unit tests; the one test that needs the built database skips itself
      - run: python -m unittest discover tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/ui_prefs_test.js
